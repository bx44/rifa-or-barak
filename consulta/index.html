<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verifica tu boleto · Gran Rifa Or Barak 2026</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0908">
<link rel="icon" href="../assets/escudo-sm.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  .mw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:50px 18px}
  .mw-in{max-width:520px;width:100%}
  .mw .shield{max-width:110px;margin:0 auto 18px;display:block}
  .mw h1{font-weight:400;font-size:clamp(26px,6vw,36px);letter-spacing:.04em;margin:0 0 8px;text-align:center}
  .mw .lead{text-align:center;color:var(--muted);margin:0 0 26px}
  .mw .card{padding:26px 22px}
  .tk{border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
  .tk-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .tk-folio{font-size:30px;font-weight:500;letter-spacing:.06em;color:var(--gold-hi)}
  .tk-est{font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:5px 12px;border-radius:999px;border:1px solid var(--line)}
  .tk-est.pagado{color:#8fe0a8;border-color:#2f6b43}
  .tk-est.pend{color:#f2c879;border-color:#7a5a22}
  .tk-row{display:flex;justify-content:space-between;color:var(--muted);font-size:15px;margin-top:8px}
  .tk-row b{color:var(--text,#f4efe6);font-weight:500}
  .tk .btn-col{margin-top:14px}
  .small{font-size:14px;color:var(--muted);text-align:center;margin-top:22px}
  .small a{color:var(--gold-hi)}
</style>
</head>
<body>
<section class="mw hero">
  <div class="beam" aria-hidden="true"></div>
  <div class="mw-in">
    <a href="../"><img class="shield" src="../assets/escudo.jpg" alt="Escudo de Or Barak"></a>
    <p class="eyebrow center">Gran Rifa Or Barak 2026</p>
    <h1>Verifica tu boleto</h1>
    <p class="lead" id="lead">Escribe el celular y el correo con los que se registró tu boleto.</p>

    <form class="card" id="f" novalidate>
      <div class="field">
        <label for="cel">Celular (10 dígitos)</label>
        <input id="cel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="55 1234 5678" required>
      </div>
      <div class="field">
        <label for="correo">Correo</label>
        <input id="correo" type="email" autocomplete="email" placeholder="tu@correo.com" required>
      </div>
      <button class="btn btn-block" id="b" type="submit">Ver mis boletos</button>
      <p class="form-msg" id="msg" role="alert"></p>
    </form>

    <div id="res" hidden></div>

    <p class="small">¿Eres vendedor? <a href="https://docs.google.com/forms/d/e/1FAIpQLSdnz5bh7ertQAeIz10DuSGakSOnmxBPM-O-0UwEuT2akRefwQ/viewform" target="_blank" rel="noopener">Consulta el estado de tus ventas</a><br>
    ¿Dudas? <a id="wa" href="#" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></p>
  </div>
</section>
<script src="../config.js"></script>
<script src="../i18n.js"></script>
<script>
(function () {
  const C = window.RIFA || {};
  const T = window.T || ((s, v) => { let o = s; if (v) Object.keys(v).forEach((k) => { o = o.split('{' + k + '}').join(v[k]); }); return o; });
  const API = C.API_URL;
  document.getElementById('wa').href = 'https://wa.me/' + (C.WHATSAPP || '526572871690') + '?text=' + encodeURIComponent(T('Hola, tengo una duda sobre mi boleto de la Gran Rifa Or Barak 2026.'));
  const $ = (id) => document.getElementById(id);
  const money = (n) => '$' + Number(n || 0).toLocaleString('es-MX');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  try { const g = JSON.parse(localStorage.getItem('rifa_consulta') || '{}'); if (g.cel) $('cel').value = g.cel; if (g.correo) $('correo').value = g.correo; } catch (e) {}

  $('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const cel = $('cel').value.replace(/\D/g, '').slice(-10);
    const correo = $('correo').value.trim().toLowerCase();
    $('msg').textContent = '';
    if (cel.length !== 10) { $('msg').textContent = T('Escribe tu celular a 10 dígitos.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo)) { $('msg').textContent = T('Escribe tu correo.'); return; }
    $('b').disabled = true; $('b').textContent = T('Buscando…');
    try {
      const q = new URLSearchParams({ accion: 'web', op: 'misboletos', cel: cel, correo: correo });
      const r = await (await fetch(API + '?' + q.toString())).json();
      if (!r.ok) { $('msg').textContent = r.error || T('No se pudo consultar. Intenta de nuevo.'); return; }
      try { localStorage.setItem('rifa_consulta', JSON.stringify({ cel: cel, correo: correo })); } catch (e) {}
      render(r);
    } catch (e) {
      $('msg').textContent = T('No se pudo conectar. Revisa tu internet e intenta de nuevo.');
    } finally {
      $('b').disabled = false; $('b').textContent = T('Ver mis boletos');
    }
  });

  function render(r) {
    $('f').hidden = true;
    const bs = r.boletos || [];
    $('lead').textContent = bs.length
      ? (r.nombre ? T('Hola {n}, ', { n: r.nombre }) : '') + (bs.length === 1 ? T('este es tu boleto.') : T('estos son tus {n} boletos.', { n: bs.length }))
      : T('Tus datos están registrados, pero todavía no tienes boletos asignados. Si acabas de comprar, espera unos minutos o escríbenos.');
    let h = '';
    bs.forEach((b) => {
      const pagado = b.estado === 'Pagado' || b.estado === 'Ganador';
      h += '<div class="tk card">' +
        '<div class="tk-top"><div><div class="eyebrow" style="margin:0 0 2px">' + T('Folio') + '</div><div class="tk-folio">' + esc(b.folio) + '</div></div>' +
        '<span class="tk-est ' + (pagado ? 'pagado' : 'pend') + '">' + esc(T(b.estado === 'Vendido' ? 'Pago pendiente' : b.estado)) + '</span></div>' +
        '<div class="tk-row"><span>' + T('Pagado') + '</span><b>' + T('{a} de {b}', { a: money(b.pagado), b: money(b.precio) }) + '</b></div>' +
        (b.saldo > 0 ? '<div class="tk-row"><span>' + T('Por pagar') + '</span><b>' + money(b.saldo) + '</b></div>' : '') +
        (b.vendedor ? '<div class="tk-row"><span>' + T('Vendedor') + '</span><b>' + esc(b.vendedor) + '</b></div>' : '') +
        '<div class="btn-col">' +
        (b.pagoUrl ? '<a class="btn btn-block" href="' + esc(b.pagoUrl) + '">' + T('Pagar {m}', { m: money(b.saldo) }) + '</a>' : '') +
        (b.muroUrl ? '<a class="btn btn-ghost btn-block btn-sm" href="' + esc(b.muroUrl) + '">' + T('Elegir cómo aparezco en el muro') + '</a>' : '') +
        '</div></div>';
    });
    h += '<p class="small"><a href="#" id="otra">' + T('Consultar con otros datos') + '</a> · ' + T('Sorteo: 10 de diciembre de 2026') + '</p>';
    $('res').innerHTML = h; $('res').hidden = false;
    $('otra').addEventListener('click', (e) => { e.preventDefault(); $('res').hidden = true; $('f').hidden = false; $('lead').textContent = T('Escribe el celular y el correo con los que se registró tu boleto.'); });
  }
})();
</script>
<!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "56f4555a49fc4941a8de00b88203edea"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
